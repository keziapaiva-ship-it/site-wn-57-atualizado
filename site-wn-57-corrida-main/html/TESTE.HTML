<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explore seu destino</title>
    <style>
        /* ====== Seção "Explore seu destino" ======
     Tudo é prefixado com .explore para não conflitar com o CSS do seu site. */
        .explore {
            --ink: #000;
            --muted: #545454;
            --bg: #f6f6f6;
            --card: #fff;
            --line: #e2e2e2;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            padding: 48px 24px;
        }

        .explore * {
            box-sizing: border-box;
        }

        .explore__inner {
            max-width: 1152px;
            margin: 0 auto;
        }

        .explore h2 {
            font-size: clamp(28px, 4vw, 40px);
            margin: 0 0 16px;
            letter-spacing: -.02em;
        }

        .explore__lead {
            max-width: 560px;
            color: var(--muted);
            line-height: 1.5;
            margin: 0 0 40px;
        }

        .explore__lead strong {
            color: var(--ink);
        }

        /* Abas */
        .explore__tabs {
            display: flex;
            gap: 32px;
            border-bottom: 4px solid var(--line);
            margin-bottom: 32px;
            overflow-x: auto;
        }

        .explore__tab {
            background: none;
            border: 0;
            padding: 12px 0 14px;
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            margin-bottom: -4px;
            border-bottom: 4px solid transparent;
            color: var(--ink);
        }

        .explore__tab[aria-selected="true"] {
            border-bottom-color: var(--ink);
        }

        .explore__tab:focus-visible,
        .explore__place:focus-visible,
        .explore__btn:focus-visible,
        .explore__more:focus-visible {
            outline: 3px solid #276ef1;
            outline-offset: 2px;
        }

        /* Layout em 3 colunas */
        .explore__grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 32px;
            height: 480px;
        }

        .explore__list {
            list-style: none;
            margin: 0;
            padding: 0 8px 0 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .explore__item {
            background: var(--card);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 16px;
            flex: none;
        }

        .explore__item.is-active {
            box-shadow: inset 0 0 0 2px var(--ink);
        }

        .explore__place {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 24px;
            text-align: left;
            background: none;
            border: 0;
            font: inherit;
            font-weight: 500;
            padding: 24px 0 24px 24px;
            cursor: pointer;
            color: var(--ink);
            min-height: 72px;
        }

        .explore__place svg {
            flex: none;
        }

        .explore__btn {
            background: var(--ink);
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 999px;
            flex: none;
        }

        .explore__btn:hover {
            background: #333;
        }

        /* Mapa */
        .explore__map {
            border-radius: 8px;
            overflow: hidden;
            background: #dfe4ea;
            min-height: 320px;
        }

        .explore__map iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* Cartões laterais */
        .explore__side {
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow: hidden;
        }

        .explore__card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .explore__img {
            height: 160px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
        }

        .explore__card-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .explore__card-title {
            font-size: 18px;
            line-height: 1.3;
            margin: 0;
            font-weight: 500;
        }

        .explore__more {
            flex: none;
            background: var(--ink);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 999px;
        }

        @media (max-width: 900px) {
            .explore__grid {
                grid-template-columns: 1fr;
                height: auto;
            }

            .explore__list {
                max-height: 420px;
            }

            .explore__map {
                height: 320px;
            }
        }
    </style>
</head>

<body>

    <section class="explore" id="explore">
        <div class="explore__inner">
            <h2>Explore seu destino</h2>
            <p class="explore__lead">Em média, leva de <strong>3 a 6 minutos</strong> para encontrar uma viagem dentro
                da cidade (Londres). Essas viagens costumam custar entre <strong>£15 e £39</strong>.</p>

            <div class="explore__tabs" role="tablist" aria-label="Categorias de destino" id="tabs"></div>

            <div class="explore__grid">
                <ul class="explore__list" id="list"></ul>

                <div class="explore__map">
                    <iframe id="map" title="Mapa do destino selecionado" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>

                <div class="explore__side">
                    <article class="explore__card">
                        <div class="explore__img" style="background-image:linear-gradient(135deg,#3b4252,#88a0b8)">
                        </div>
                        <div class="explore__card-row">
                            <h3 class="explore__card-title">Aeroporto de Heathrow: como chegar</h3>
                            <a class="explore__more" href="#">Saiba mais</a>
                        </div>
                    </article>
                    <article class="explore__card">
                        <div class="explore__img" style="background-image:linear-gradient(135deg,#5b8fd1,#e7c98a)">
                        </div>
                        <div class="explore__card-row">
                            <h3 class="explore__card-title">Guia para se locomover em Londres</h3>
                            <a class="explore__more" href="#">Saiba mais</a>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </section>

    <script>
        /* ====== DADOS ======
           Edite aqui: categorias e lugares. "busca" é o texto usado no mapa e no botão. */
        const CIDADE = "London";
        const DADOS = {
            "Atrações": [
                { nome: "Palácio de Buckingham", busca: "Buckingham Palace" },
                { nome: "Elizabeth Tower (Big Ben)", busca: "Big Ben" },
                { nome: "Royal Albert Hall", busca: "Royal Albert Hall" },
                { nome: "Natural History Museum", busca: "Natural History Museum" },
                { nome: "Battersea Power Station", busca: "Battersea Power Station" },
                { nome: "Tower of London", busca: "Tower of London" }
            ],
            "Transporte": [
                { nome: "Aeroporto de Heathrow", busca: "Heathrow Airport" },
                { nome: "Estação King's Cross", busca: "King's Cross Station" },
                { nome: "Estação Paddington", busca: "Paddington Station" },
                { nome: "Aeroporto de Gatwick", busca: "Gatwick Airport" }
            ],
            "Hotéis": [
                { nome: "The Savoy", busca: "The Savoy Hotel" },
                { nome: "The Ritz London", busca: "The Ritz London" },
                { nome: "Claridge's", busca: "Claridge's" }
            ],
            "Entretenimento": [
                { nome: "West End Theatres", busca: "West End Theatre District" },
                { nome: "O2 Arena", busca: "The O2 Arena" },
                { nome: "Wembley Stadium", busca: "Wembley Stadium" }
            ],
            "Restaurantes": [
                { nome: "Borough Market", busca: "Borough Market" },
                { nome: "Dishoom Covent Garden", busca: "Dishoom Covent Garden" },
                { nome: "Sky Garden", busca: "Sky Garden London" }
            ]
        };

        /* Ação do botão "Iniciar". Por padrão abre a rota no Google Maps.
           Troque pelo link do seu sistema de reservas/corridas. */
        const linkIniciar = (lugar) =>
            "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(lugar.busca + ", " + CIDADE);

        /* ====== LÓGICA ====== */
        const tabsEl = document.getElementById("tabs");
        const listEl = document.getElementById("list");
        const mapEl = document.getElementById("map");
        const PIN = '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>';

        function mostrarMapa(lugar) {
            mapEl.src = "https://maps.google.com/maps?q=" + encodeURIComponent(lugar.busca + ", " + CIDADE) + "&z=14&output=embed";
        }

        function renderLista(categoria) {
            listEl.innerHTML = "";
            DADOS[categoria].forEach((lugar, i) => {
                const li = document.createElement("li");
                li.className = "explore__item";

                const sel = document.createElement("button");
                sel.type = "button";
                sel.className = "explore__place";
                sel.innerHTML = PIN + "<span></span>";
                sel.lastChild.textContent = lugar.nome;
                sel.addEventListener("click", () => {
                    listEl.querySelectorAll(".explore__item").forEach(el => el.classList.remove("is-active"));
                    li.classList.add("is-active");
                    mostrarMapa(lugar);
                });

                const go = document.createElement("a");
                go.className = "explore__btn";
                go.textContent = "Iniciar";
                go.href = linkIniciar(lugar);
                go.target = "_blank";
                go.rel = "noopener";
                go.setAttribute("aria-label", "Iniciar viagem para " + lugar.nome);

                li.append(sel, go);
                listEl.appendChild(li);
                if (i === 0) { li.classList.add("is-active"); mostrarMapa(lugar); }
            });
            listEl.scrollTop = 0;
        }

        function selecionarAba(nome) {
            tabsEl.querySelectorAll(".explore__tab").forEach(t => t.setAttribute("aria-selected", t.dataset.aba === nome));
            renderLista(nome);
        }

        Object.keys(DADOS).forEach((nome, i) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "explore__tab";
            b.setAttribute("role", "tab");
            b.dataset.aba = nome;
            b.textContent = nome;
            b.addEventListener("click", () => selecionarAba(nome));
            tabsEl.appendChild(b);
            if (i === 0) selecionarAba(nome);
        });
    </script>
</body>

</html>
